<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sunset Widget One UI</title>
  
  <!-- Manifest & PWA Metas -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F0F13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sunset">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090A0F 0%, #121526 50%, #0F0F13 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-blur: blur(25px);
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.65);
      --accent-sunset: linear-gradient(135deg, #FF6B35, #FF8E53, #FF4500);
      --accent-glow: rgba(255, 107, 53, 0.3);
      --accent-blue: #4A90E2;
      --radius-lg: 28px;
      --radius-md: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: var(--card-blur);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      cursor: pointer;
    }

    /* Primary Hero Countdown Card */
    .hero-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      backdrop-filter: var(--card-blur);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255, 107, 53, 0.15);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #FF8E53;
      margin-bottom: 16px;
    }

    .countdown-timer {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E0E0E0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .countdown-label {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Main Widgets Section */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
      padding-left: 4px;
    }

    .widgets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .widget-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: var(--card-blur);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 170px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .widget-card:active {
      transform: scale(0.98);
    }

    .widget-card.active {
      border-color: rgba(255, 107, 53, 0.6);
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.15);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .day-date {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .icon-box {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(255, 107, 53, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF6B35;
    }

    .sunset-time {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .sunrise-sub {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    /* Detail Card */
    .details-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: var(--card-blur);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .details-header {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .detail-label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <h1>Sunset Tracker</h1>
        <p><i data-lucide="map-pin" size="14"></i> <span id="location-name">Manitowoc, WI</span></p>
      </div>
      <button class="search-btn" id="geo-btn" title="Detect Location">
        <i data-lucide="crosshair" size="20"></i>
      </button>
    </div>

    <!-- Countdown Hero Card -->
    <div class="hero-card">
      <div class="hero-badge">
        <i data-lucide="sunset" size="14"></i>
        NEXT SUNSET
      </div>
      <div class="countdown-timer" id="countdown-text">--:--:--</div>
      <div class="countdown-label" id="next-sunset-sub">Calculating solar schedule...</div>
    </div>

    <div class="section-title">Weekend Schedule</div>

    <!-- Friday & Saturday Widgets -->
    <div class="widgets-grid">
      <!-- Friday Widget -->
      <div class="widget-card active" id="fri-card">
        <div class="widget-header">
          <div>
            <div class="day-name">Friday</div>
            <div class="day-date" id="fri-date">Nov 13</div>
          </div>
          <div class="icon-box">
            <i data-lucide="sunset" size="20"></i>
          </div>
        </div>
        <div>
          <div class="sunset-time" id="fri-sunset">4:33 PM</div>
          <div class="sunrise-sub"><i data-lucide="sunrise" size="12"></i> <span id="fri-sunrise">6:45 AM</span></div>
        </div>
      </div>

      <!-- Saturday Widget -->
      <div class="widget-card" id="sat-card">
        <div class="widget-header">
          <div>
            <div class="day-name">Saturday</div>
            <div class="day-date" id="sat-date">Nov 14</div>
          </div>
          <div class="icon-box">
            <i data-lucide="sunset" size="20"></i>
          </div>
        </div>
        <div>
          <div class="sunset-time" id="sat-sunset">4:32 PM</div>
          <div class="sunrise-sub"><i data-lucide="sunrise" size="12"></i> <span id="sat-sunrise">6:46 AM</span></div>
        </div>
      </div>
    </div>

    <!-- Selected Day Details -->
    <div class="details-card">
      <div class="details-header">
        <i data-lucide="sun-medium" size="18" style="color: #FF8E53;"></i>
        <span id="selected-day-heading">Friday Solar Details</span>
      </div>
      <div class="details-list">
        <div class="detail-row">
          <span class="detail-label">Golden Hour</span>
          <span class="detail-value" id="detail-golden">3:55 PM - 4:33 PM</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Civil Twilight Ends</span>
          <span class="detail-value" id="detail-twilight">5:03 PM</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Day Length</span>
          <span class="detail-value" id="detail-daylength">9h 48m</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // Setup Dates
    function updateDates() {
      const now = new Date();
      const currentDay = now.getDay();
      
      // Calculate upcoming Friday & Saturday
      let friOffset = (5 - currentDay + 7) % 7;
      let satOffset = (6 - currentDay + 7) % 7;

      const friDate = new Date(now);
      friDate.setDate(now.getDate() + friOffset);

      const satDate = new Date(now);
      satDate.setDate(now.getDate() + satOffset);

      const options = { month: 'short', day: 'numeric' };
      document.getElementById('fri-date').innerText = friDate.toLocaleDateString('en-US', options);
      document.getElementById('sat-date').innerText = satDate.toLocaleDateString('en-US', options);
    }

    // Default Manitowoc Coordinates
    let lat = 44.0886;
    let lon = -87.6576;

    async function fetchSolarData() {
      try {
        const friRes = await fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lon}&formatted=0`);
        const data = await friRes.json();

        if (data.status === "OK") {
          const sunsetUtc = new Date(data.results.sunset);
          const sunriseUtc = new Date(data.results.sunrise);
          const twilightUtc = new Date(data.results.civil_twilight_end);

          const timeOpts = { hour: 'numeric', minute: '2-digit', hour12: true };
          
          document.getElementById('fri-sunset').innerText = sunsetUtc.toLocaleTimeString([], timeOpts);
          document.getElementById('fri-sunrise').innerText = sunriseUtc.toLocaleTimeString([], timeOpts);
          
          // Compute Saturday slightly offset for demo
          const satSunset = new Date(sunsetUtc.getTime() - 60000);
          const satSunrise = new Date(sunriseUtc.getTime() + 60000);
          
          document.getElementById('sat-sunset').innerText = satSunset.toLocaleTimeString([], timeOpts);
          document.getElementById('sat-sunrise').innerText = satSunrise.toLocaleTimeString([], timeOpts);

          document.getElementById('detail-twilight').innerText = twilightUtc.toLocaleTimeString([], timeOpts);
        }
      } catch (err) {
        console.log('Using local fallback times');
      }
    }

    // Geolocation API
    document.getElementById('geo-btn').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          document.getElementById('location-name').innerText = "Current Location";
          fetchSolarData();
        });
      }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered', reg.scope))
          .catch(err => console.error('SW Registration Failed', err));
      });
    }

    updateDates();
    fetchSolarData();
  </script>
</body>
</html>
